<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1100px;height:700px;font-family:"Microsoft YaHei",sans-serif;overflow:hidden;position:relative;
background:
 radial-gradient(circle at 15% 20%, rgba(74,222,128,.18), transparent 42%),
 radial-gradient(circle at 85% 75%, rgba(59,130,246,.22), transparent 45%),
 linear-gradient(135deg,#0b1220 0%,#131c2e 50%,#0d1a14 100%)}
.grid{position:absolute;inset:0;opacity:.16;
background-image:linear-gradient(rgba(255,255,255,.35) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.35) 1px,transparent 1px);
background-size:42px 42px;transform:perspective(600px) rotateX(52deg) scale(2.1);transform-origin:center bottom}
.glow{position:absolute;width:520px;height:520px;border-radius:50%;filter:blur(120px);pointer-events:none}
.g1{background:rgba(74,222,128,.22);top:-160px;left:-80px}
.g2{background:rgba(59,130,246,.22);bottom:-200px;right:-100px}
.wrap{position:relative;height:100%;display:flex;flex-direction:column;padding:26px 32px;color:#eaf0fa}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}
.logo{font-size:21px;font-weight:800;letter-spacing:.5px}
.logo b{color:#4ade80}
.logo em{font-style:normal;font-size:11px;color:#7c8aa0;margin-left:8px;font-weight:400}
.nav{display:flex;gap:8px}
.nav a{padding:8px 16px;border-radius:20px;font-size:12.5px;color:#9fb0c7;cursor:pointer;border:1px solid transparent}
.nav a.on{background:rgba(74,222,128,.12);color:#4ade80;border-color:rgba(74,222,128,.3)}
.center{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.hero{font-size:42px;font-weight:800;letter-spacing:1px;margin-bottom:6px;text-shadow:0 6px 30px rgba(0,0,0,.5)}
.hero span{background:linear-gradient(135deg,#4ade80,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-sub{font-size:13px;color:#8fa1ba;margin-bottom:34px;letter-spacing:.5px}
.launch{background:linear-gradient(135deg,#22c55e,#16a34a);border:none;color:#fff;padding:18px 76px;border-radius:16px;font-size:18px;font-weight:800;letter-spacing:2px;cursor:pointer;box-shadow:0 10px 40px rgba(34,197,94,.35),inset 0 1px 0 rgba(255,255,255,.2)}
.launch:hover{transform:translateY(-2px)}
.quick{display:flex;gap:12px;margin-top:22px}
.chip{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px 18px;font-size:12px;color:#c3d0e2;cursor:pointer;backdrop-filter:blur(6px)}
.chip b{color:#4ade80}
.chip:hover{background:rgba(255,255,255,.1)}
.bottom{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:#6d7d94}
.bar{position:absolute;left:32px;right:32px;bottom:64px;height:4px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:62%;background:linear-gradient(90deg,#22c55e,#4ade80,#22d3ee);border-radius:3px}
</style></head><body>
<div class="grid"></div><div class="glow g1"></div><div class="glow g2"></div>
<div class="wrap">
  <div class="top">
    <div class="logo">方块启动器 <b>BLOCK</b> <em>v0.1 · 自研</em></div>
    <div class="nav"><a class="on">开始游戏</a><a>版本库</a><a>模组</a><a>设置</a></div>
  </div>
  <div class="center">
    <div class="hero">准备进入 <span>1.21.4</span></div>
    <div class="hero-sub">Fabric 0.16.9 · Java 21 · 上次游玩 2 小时前</div>
    <button class="launch">启 动 游 戏</button>
    <div class="quick">
      <div class="chip">切换版本 <b>1.20.1</b></div>
      <div class="chip">内存 <b>4096 MB</b></div>
      <div class="chip">打开目录</div>
      <div class="chip">+ 新建实例</div>
    </div>
  </div>
  <div class="bar"><i></i></div>
  <div class="bottom"><div>正在检查资源完整性…</div><div>4 个实例 · 3 个已就绪</div></div>
</div></body></html>
