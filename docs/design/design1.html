<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1100px;height:700px;font-family:"Microsoft YaHei",sans-serif;background:#0f1117;color:#e8ecf3;overflow:hidden}
.wrap{display:flex;height:100%}
.side{width:230px;background:#161922;border-right:1px solid #232838;padding:16px 12px;display:flex;flex-direction:column}
.logo{font-size:17px;font-weight:700;color:#5b9bff;margin-bottom:4px}
.slogan{font-size:11px;color:#5a6478;margin-bottom:22px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav a{padding:9px 12px;border-radius:8px;font-size:13px;color:#9aa7bd;cursor:pointer}
.nav a.on{background:#1e2637;color:#5b9bff;font-weight:600}
.nav a:hover{background:#1a1f2c}
.user{margin-top:auto;padding:10px;background:#1a1f2c;border-radius:10px;font-size:12px;color:#9aa7bd}
.main{flex:1;padding:22px 26px;overflow:hidden}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.title{font-size:20px;font-weight:700}
.btn{background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;border:none;padding:9px 22px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 4px 14px rgba(59,130,246,.3)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{background:#161b26;border:1px solid #232838;border-radius:12px;padding:16px;cursor:pointer;transition:.2s}
.card:hover{border-color:#3b82f6;transform:translateY(-2px)}
.card.on{border-color:#3b82f6;background:#182234}
.ver{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.vname{font-size:15px;font-weight:700}
.tag{font-size:10px;padding:2px 7px;border-radius:5px;background:#1f3a2a;color:#4ade80}
.tag.f{background:#2a2438;color:#a78bfa}
.meta{font-size:11.5px;color:#6b7789;line-height:1.7}
.bar{margin-top:12px;height:5px;background:#232838;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#3b82f6,#60a5fa);border-radius:3px}
</style></head><body>
<div class="wrap">
  <div class="side">
    <div class="logo">方块启动器</div>
    <div class="slogan">Block Launcher · 自研</div>
    <div class="nav">
      <a class="on">游戏列表</a>
      <a>下载版本</a>
      <a>模组管理</a>
      <a>设置</a>
      <a>关于</a>
    </div>
    <div class="user">👤 未登录 · 点此登录</div>
  </div>
  <div class="main">
    <div class="head">
      <div class="title">我的游戏</div>
      <button class="btn">＋ 新建实例</button>
    </div>
    <div class="cards">
      <div class="card on">
        <div class="ver"><span class="vname">1.21.4 · 生存服</span><span class="tag">已就绪</span></div>
        <div class="meta">Fabric 0.16.9 · Java 21<br>上次游玩 2 小时前</div>
        <div class="bar"><i style="width:100%"></i></div>
      </div>
      <div class="card">
        <div class="ver"><span class="vname">1.20.1 · 整合包</span><span class="tag">已就绪</span></div>
        <div class="meta">Forge 47.3.0 · Java 17<br>上次游玩 昨天</div>
        <div class="bar"><i style="width:100%"></i></div>
      </div>
      <div class="card">
        <div class="ver"><span class="vname">26.3 · 最新版</span><span class="tag f">新</span></div>
        <div class="meta">原版 · 未安装 Java<br>点击下载</div>
        <div class="bar"><i style="width:0%"></i></div>
      </div>
      <div class="card">
        <div class="ver"><span class="vname">1.12.2 · 怀旧</span><span class="tag">已就绪</span></div>
        <div class="meta">Forge 14.23.5 · Java 8<br>上次游玩 3 天前</div>
        <div class="bar"><i style="width:100%"></i></div>
      </div>
    </div>
    <div style="margin-top:18px;background:#161b26;border:1px solid #232838;border-radius:12px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center">
      <div style="font-size:12.5px;color:#9aa7bd">当前选中：<b style="color:#e8ecf3">1.21.4 · 生存服</b> · Fabric · Java 21</div>
      <button class="btn" style="padding:10px 34px">启动游戏</button>
    </div>
  </div>
</div></body></html>
